name: quality

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py tests/*.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py verify examples/sort-benchmark
      - run: python scripts/workflow.py verify examples/sort-benchmark
      - run: python scripts/validate_experiment.py examples/sort-benchmark --phase 8
